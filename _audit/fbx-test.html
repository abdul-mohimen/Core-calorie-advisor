<!doctype html><meta charset="utf-8">
<body style="margin:0;background:#0F1115">
<div id="stage" style="width:900px;height:700px"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="../assets/js/titan-rig.js"></script>
<script>
window.__r = null;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0F1115);
const cam = new THREE.PerspectiveCamera(42, 900/700, .1, 100);
cam.position.set(2.4, 1.5, 3.0); cam.lookAt(0, 0.95, 0);
const rn = new THREE.WebGLRenderer({antialias:true}); rn.setSize(900,700);
document.getElementById('stage').appendChild(rn.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.3); key.position.set(3,5,4); scene.add(key);
const fill = new THREE.DirectionalLight(0xffd9b0, 1.1); fill.position.set(-3,2,-2); scene.add(fill);

new THREE.FBXLoader().load('../assets/models/trainer-ch06.fbx', function(obj){
  const box = new THREE.Box3().setFromObject(obj);
  const h = box.max.y - box.min.y;
  obj.scale.setScalar(1.8 / h);
  obj.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(obj);
  obj.position.y -= b2.min.y;
  scene.add(obj);

  const attached = window.CCARig && CCARig.attach(obj);
  let spine=null, arm=null;
  obj.traverse(function(o){ if(o.isBone){
    if(!spine && /Spine$/i.test(o.name)) spine=o;
    if(!arm && /LeftArm$/i.test(o.name)) arm=o;
  }});
  const samples=[]; let t=0;
  function tick(){
    t += 0.05;
    if (attached) CCARig.update('squat', t);
    if (spine && arm) samples.push(+(spine.rotation.x + arm.rotation.z).toFixed(4));
    rn.render(scene, cam);
    if (samples.length < 24) requestAnimationFrame(tick);
    else window.__r = { ok:true, attached:!!attached, moved:new Set(samples).size>1,
                        distinct:new Set(samples).size, rawHeight:+h.toFixed(1) };
  }
  tick();
}, undefined, function(e){ window.__r = { ok:false, error:String((e&&e.message)||e) }; });
</script></body>
